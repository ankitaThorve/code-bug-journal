<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Structure</title>
  </head>
  <body>
    <script>
      // alert("Hello World");
      alert("Hello");
      alert("World");

      // semicolon
      alert('hi')
      alert('there')

      // in most case, newline implise a semicolons, but NOT ALWAYS
      alert(3 +
        1
        + 2
      )

      // example of an error
      alert("Hello")
      [1,2].forEach(alert);

      // comment------
      // This comment occupies a line of its own
      alert("harry");
      alert('potter'); // This comment follows the statement
      
      /*An example with two messages.
      This is multiline comment.*/
      
      /*Commenting out the code
      alert("harry");
     */

    </script>
  </body>
</html>
