<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Structure</title>
  </head>
  <body>
    <script>
      // alert("Hello World");
      alert("Hello");
      alert("World");

      // semicolon
      alert('hi')
      alert('there')

      // in most case, newline implise a semicolons, but NOT ALWAYS
      alert(3 +
        1
        + 2
      )

      // example of an error
      alert("Hello")
      [1,2].forEach(alert);
    </script>
  </body>
</html>
